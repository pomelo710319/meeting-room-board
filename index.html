<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會議室預約看板</title>
<style>
  /* ===== 設計代幣 =====
     設計概念：像會議室門牌的時刻表。三間會議室各有一個固定色，
     看板上的預約是連續的色塊，而不是一格一格的小方塊。 */
  :root {
    --paper: #e8ecef;      /* 頁面底色：偏冷的灰藍紙 */
    --sheet: #f8f9fa;      /* 看板與表單的底色 */
    --ink: #14202b;        /* 主要文字 */
    --muted: #5a6978;      /* 次要文字 */
    --rule: #cfd6dc;       /* 分隔線 */
    --rule-soft: #e1e6ea;

    --room-a: #0e7c86;     /* 青藍 */
    --room-a-tint: #d3ecee;
    --room-b: #5b46b5;     /* 紫 */
    --room-b-tint: #e0dcf4;
    --room-c: #b7790a;     /* 琥珀 */
    --room-c-tint: #f6e6c4;

    --accent: #14202b;     /* 主要按鈕沿用墨色，讓三個會議室色保持主角 */
    --now: #d6342c;        /* 「現在」時間線 */
    --error-bg: #fbe9e7;
    --error-text: #a3261d;
    --ok-bg: #e2f2e9;
    --ok-text: #17663f;

    --font: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
  }
  :focus-visible { outline: 3px solid var(--room-b); outline-offset: 2px; }

  /* ===== 頁首 ===== */
  header {
    max-width: 1160px;
    margin: 0 auto;
    padding: 28px 20px 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 0.02em; }
  header .today { color: var(--muted); font-size: 15px; }

  main {
    max-width: 1160px;
    margin: 16px auto 40px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 312px;
    gap: 24px;
    align-items: start;
  }
  /* 看板放左側（主角），表單放右側 */
  .board { grid-column: 1; grid-row: 1; }
  .booking { grid-column: 2; grid-row: 1; position: sticky; top: 16px; }
  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .board, .booking { grid-column: 1; position: static; }
    .booking { grid-row: 2; }
  }

  .panel {
    background: var(--sheet);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 20px;
  }
  .panel h2 { margin: 0 0 16px; font-size: 18px; }

  /* ===== 表單 ===== */
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; min-width: 0; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: #fff;
  }
  .submit {
    width: 100%;
    padding: 11px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .submit:hover { background: #2a3a49; }

  /* ===== 提示訊息 ===== */
  .message {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 14px;
  }
  .message.error { display: block; background: var(--error-bg); color: var(--error-text); }
  .message.ok { display: block; background: var(--ok-bg); color: var(--ok-text); }

  /* ===== 看板標題列 ===== */
  .board-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .board-head h2 { margin: 0; font-size: 30px; font-weight: 800; line-height: 1.2; }
  .board-head .weekday { display: block; font-size: 15px; font-weight: 400; color: var(--muted); }
  .board-head input, .board-head select { width: auto; }

  /* ===== 看板控制列：日／週切換、前後翻頁 ===== */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .group {
    display: inline-flex;
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
  }
  .btn {
    font: inherit;
    font-size: 14px;
    padding: 7px 12px;
    color: var(--ink);
    background: #fff;
    border: 0;
    cursor: pointer;
  }
  .group .btn + .btn { border-left: 1px solid var(--rule); }
  .btn:hover { background: var(--rule-soft); }
  .btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
  /* 「今天／本週」按鈕用現在時間線的紅色，和前後翻頁區分 */
  .btn.today { background: var(--now); color: #fff; font-weight: 700; }
  .btn.today:hover { background: #b8271f; }

  /* ===== 時刻表看板 ===== */
  .scroller { overflow-x: auto; }
  .grid {
    display: grid;
    grid-template-columns: 56px repeat(3, minmax(120px, 1fr));
    min-width: 520px;
    background: var(--sheet);
    border: 1px solid var(--rule);
    border-radius: 6px;
    overflow: hidden;
    font-size: 14px;
  }
  .grid .head {
    padding: 10px 10px 12px;
    border-left: 1px solid var(--rule-soft);
    border-bottom: 2px solid var(--ink);
    border-top: 5px solid var(--room-color);
  }
  .grid .head.corner { border-left: none; border-top-color: transparent; }
  .grid .head .name { font-weight: 800; font-size: 16px; }
  .grid .head .state { font-size: 13px; color: var(--muted); }
  .grid .head .state.busy { color: var(--room-color); font-weight: 700; }
  .grid .time {
    padding: 6px 8px 0 0;
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--rule-soft);
  }
  /* 空時段：點一下就帶入表單 */
  .grid .slot {
    all: unset;
    box-sizing: border-box;
    min-height: 44px;
    border-left: 1px solid var(--rule-soft);
    border-bottom: 1px solid var(--rule-soft);
    cursor: pointer;
    color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .grid .slot:hover, .grid .slot:focus-visible { background: var(--tint); color: var(--room-color); }
  .grid .slot:focus-visible { outline: 3px solid var(--room-b); outline-offset: -3px; }
  /* 預約：跨越多個時段的連續色塊 */
  .grid .booked {
    margin: 2px 4px;
    padding: 6px 10px;
    background: var(--tint);
    border-left: 5px solid var(--room-color);
    border-radius: 3px;
    z-index: 1;
    overflow: hidden;
  }
  .grid .booked .who { font-weight: 800; }
  .grid .booked .span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .grid .booked.fresh { animation: settle 0.45s ease-out; }
  @keyframes settle {
    from { transform: scale(0.96); opacity: 0.4; }
    to { transform: scale(1); opacity: 1; }
  }
  /* 現在時間線（只在查看「今天」時出現） */
  .grid .nowline {
    grid-column: 2 / -1;
    position: relative;
    z-index: 2;
    pointer-events: none;
  }
  .grid .nowline::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: var(--at);
    border-top: 2px solid var(--now);
  }
  .grid .nowline::after {
    content: "";
    position: absolute;
    left: -5px;
    top: calc(var(--at) - 4px);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--now);
  }
  /* 週視圖：七天一欄，整張看板用同一間會議室的顏色 */
  .grid.week { grid-template-columns: 56px repeat(7, minmax(88px, 1fr)); min-width: 720px; }
  .grid button.head {
    font: inherit;
    color: inherit;
    text-align: left;
    background: transparent;
    border-right: 0;
    cursor: pointer;
  }
  .grid button.head:hover { background: var(--tint); }
  .grid .head.is-today { background: var(--tint); }
  .grid .head.is-today .state { color: var(--ink); font-weight: 700; }
  .room-0 { --room-color: var(--room-a); --tint: var(--room-a-tint); }
  .room-1 { --room-color: var(--room-b); --tint: var(--room-b-tint); }
  .room-2 { --room-color: var(--room-c); --tint: var(--room-c-tint); }

  /* ===== 預約列表 ===== */
  .list-head { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 8px; }
  .list-title { margin: 0; font-size: 16px; }
  .export-btn { border: 1px solid var(--rule); border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 400; font-size: 14px; }
  td.time-cell { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .dot {
    display: inline-block;
    width: 10px; height: 10px;
    margin-right: 8px;
    border-radius: 2px;
    background: var(--room-color);
  }
  td.action-cell { text-align: right; white-space: nowrap; }
  .cancel-btn {
    font: inherit; font-size: 13px;
    padding: 2px 10px;
    border: 1px solid var(--now); border-radius: 4px;
    background: transparent; color: var(--now);
    cursor: pointer;
  }
  .cancel-btn:hover { background: var(--now); color: #fff; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }

  @media (prefers-reduced-motion: reduce) {
    .grid .booked.fresh { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1>會議室預約看板</h1>
  <div class="today" id="todayText"></div>
</header>

<main>
  <!-- 左側：當日看板 -->
  <section class="board" aria-labelledby="boardTitle">
    <div class="board-head">
      <h2 id="boardTitle">當日預約</h2>
      <div class="controls">
        <div class="group" role="group" aria-label="檢視模式">
          <button type="button" class="btn" id="modeDay" aria-pressed="true">日</button>
          <button type="button" class="btn" id="modeWeek" aria-pressed="false">週</button>
        </div>
        <select id="weekRoom" aria-label="週視圖的會議室" hidden></select>
        <div class="group" role="group" aria-label="切換日期">
          <button type="button" class="btn" id="prevBtn">前一天</button>
          <button type="button" class="btn today" id="todayBtn">今天</button>
          <button type="button" class="btn" id="nextBtn">後一天</button>
        </div>
        <input type="date" id="viewDate" aria-label="查看日期">
      </div>
    </div>
    <div class="scroller">
      <div id="grid" class="grid"></div>
    </div>

    <div class="list-head">
      <h3 class="list-title">預約列表</h3>
      <button type="button" class="btn export-btn" id="exportBtn">匯出 CSV</button>
    </div>

    <table>
      <thead id="listHead"></thead>
      <tbody id="list"></tbody>
    </table>
  </section>

  <!-- 右側：預約表單 -->
  <section class="panel booking">
    <h2>新增預約</h2>
    <form id="bookingForm" novalidate>
      <div class="field">
        <label for="room">會議室</label>
        <select id="room"></select>
      </div>
      <div class="field">
        <label for="date">日期</label>
        <input type="date" id="date">
      </div>
      <div class="row">
        <div class="field">
          <label for="start">開始時段</label>
          <select id="start"></select>
        </div>
        <div class="field">
          <label for="end">結束時段</label>
          <select id="end"></select>
        </div>
      </div>
      <div class="field">
        <label for="name">預約人姓名</label>
        <input type="text" id="name" maxlength="30" placeholder="請輸入姓名">
      </div>
      <button type="submit" class="submit">送出預約</button>
      <div id="message" class="message" role="status"></div>
    </form>
  </section>
</main>

<script>
  // ===== 設定 =====
  const ROOMS = ['會議室 A', '會議室 B', '會議室 C']; // 固定 3 間會議室
  const OPEN_HOUR = 8;   // 最早可預約時間（08:00）
  const CLOSE_HOUR = 20; // 最晚結束時間（20:00）
  const STORAGE_KEY = 'meeting-room-bookings';

  // ===== DOM 元素 =====
  const form = document.getElementById('bookingForm');
  const roomSelect = document.getElementById('room');
  const dateInput = document.getElementById('date');
  const startSelect = document.getElementById('start');
  const endSelect = document.getElementById('end');
  const nameInput = document.getElementById('name');
  const messageBox = document.getElementById('message');
  const viewDateInput = document.getElementById('viewDate');
  const boardTitle = document.getElementById('boardTitle');
  const gridBox = document.getElementById('grid');
  const listBody = document.getElementById('list');
  const todayText = document.getElementById('todayText');
  const listHead = document.getElementById('listHead');
  const modeDayBtn = document.getElementById('modeDay');
  const modeWeekBtn = document.getElementById('modeWeek');
  const weekRoomSelect = document.getElementById('weekRoom');
  const prevBtn = document.getElementById('prevBtn');
  const todayBtn = document.getElementById('todayBtn');
  const nextBtn = document.getElementById('nextBtn');
  const exportBtn = document.getElementById('exportBtn');

  // 看板狀態：'day' 是三間會議室並排的單日視圖，'week' 是單一會議室的整週視圖
  let viewMode = 'day';
  let weekRoom = 0; // 週視圖目前選的會議室（ROOMS 索引）

  // 剛送出的預約 id，用來讓該色塊播放一次出現動畫
  let freshId = null;

  // ===== 工具函式 =====

  // 把小時數字轉成 "09:00" 格式
  function formatHour(hour) {
    return String(hour).padStart(2, '0') + ':00';
  }

  // 取得今天的日期字串（YYYY-MM-DD，本機時區）
  function todayString() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }

  // 把 Date 轉成 YYYY-MM-DD（本機時區）
  function toDateString(date) {
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${m}-${day}`;
  }

  // 日期字串加減天數（用本機時間運算，跨月、跨年都正確）
  function addDays(dateStr, n) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return toDateString(new Date(y, m - 1, d + n));
  }

  // 取得該日所在那一週的星期一（週一為一週的開始）
  function mondayOf(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dow = new Date(y, m - 1, d).getDay(); // 0 = 週日
    return addDays(dateStr, -((dow + 6) % 7));
  }

  // 目前看板查看的日期（輸入框被清空時退回今天）
  function currentViewDate() {
    return viewDateInput.value || todayString();
  }

  // 把 YYYY-MM-DD 轉成「11 月 20 日」與「星期五」
  function describeDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return {
      day: `${m} 月 ${d} 日`,
      weekday: date.toLocaleDateString('zh-TW', { weekday: 'long' }),
    };
  }

  // 建立一個帶文字的元素（用 textContent 避免使用者輸入被當成 HTML）
  function createEl(tag, text, className) {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
  }

  // ===== 資料存取（localStorage） =====

  // 讀取全部預約；資料損毀時回傳空陣列，避免整頁壞掉
  function loadBookings() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  // 寫入全部預約
  function saveBookings(bookings) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
  }

  // ===== 匯出 CSV =====

  // 轉成 CSV 欄位：含逗號、引號、換行時以雙引號包起來；
  // 開頭為 = + - @ 的文字前面補單引號，避免用 Excel 開啟時被當成公式執行
  function csvCell(value) {
    let text = String(value);
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
    return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  // 匯出全部預約（依日期、開始時間排序）為 CSV 檔下載
  function exportCsv() {
    const rows = loadBookings().sort((a, b) =>
      a.date.localeCompare(b.date) || a.start - b.start || a.room - b.room);
    const pad = h => String(h).padStart(2, '0') + ':00';
    const lines = [['日期', '會議室', '開始', '結束', '預約人']];
    rows.forEach(b => lines.push([
      b.date, ROOMS[b.room] || '', pad(b.start), pad(b.end), b.name,
    ]));
    const csv = lines.map(r => r.map(csvCell).join(',')).join('\r\n');
    // 開頭加 BOM，Excel 才會正確辨識 UTF-8 中文
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `預約紀錄-${todayString()}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  // ===== 衝突檢查 =====

  // 找出同會議室、同日期、時段重疊的預約（首尾相接不算）；沒有則回傳 undefined
  function findConflict(bookings, newBooking) {
    return bookings.find(b =>
      b.room === newBooking.room &&
      b.date === newBooking.date &&
      newBooking.start < b.end &&
      newBooking.end > b.start
    );
  }

  // ===== 提示訊息 =====
  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = 'message ' + type;
  }

  // ===== 初始化表單選項 =====
  function initForm() {
    ROOMS.forEach((name, index) => {
      roomSelect.appendChild(new Option(name, index));
      weekRoomSelect.appendChild(new Option(name, index));
    });
    // 開始時段：08:00 ~ 19:00
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      startSelect.appendChild(new Option(formatHour(h), h));
    }
    // 結束時段：09:00 ~ 20:00
    for (let h = OPEN_HOUR + 1; h <= CLOSE_HOUR; h++) {
      endSelect.appendChild(new Option(formatHour(h), h));
    }
    const today = todayString();
    dateInput.value = today;
    viewDateInput.value = today;
    const t = describeDate(today);
    todayText.textContent = `今天 ${t.day} ${t.weekday}`;
  }

  // 開始時段改變時，若結束時段不晚於開始，自動把結束調成開始後一小時
  startSelect.addEventListener('change', () => {
    const start = Number(startSelect.value);
    if (Number(endSelect.value) <= start) {
      endSelect.value = start + 1;
    }
  });

  // 表單日期改變時，看板同步切到該日，方便確認當天空檔
  dateInput.addEventListener('change', () => {
    if (dateInput.value) {
      viewDateInput.value = dateInput.value;
      render();
    }
  });

  viewDateInput.addEventListener('change', render);

  // 前後翻頁：日視圖一次一天，週視圖一次一週
  function shiftView(direction) {
    const step = viewMode === 'week' ? 7 : 1;
    viewDateInput.value = addDays(currentViewDate(), direction * step);
    render();
  }
  prevBtn.addEventListener('click', () => shiftView(-1));
  nextBtn.addEventListener('click', () => shiftView(1));
  todayBtn.addEventListener('click', () => {
    viewDateInput.value = todayString();
    render();
  });

  // 日／週切換；週視圖會停在目前查看日期所在的那一週
  function setViewMode(mode) {
    viewMode = mode;
    render();
  }
  exportBtn.addEventListener('click', exportCsv);
  modeDayBtn.addEventListener('click', () => setViewMode('day'));
  modeWeekBtn.addEventListener('click', () => setViewMode('week'));
  weekRoomSelect.addEventListener('change', () => {
    weekRoom = Number(weekRoomSelect.value);
    render();
  });

  // ===== 送出預約 =====
  form.addEventListener('submit', (event) => {
    event.preventDefault();

    const booking = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      room: Number(roomSelect.value),
      date: dateInput.value,
      start: Number(startSelect.value),
      end: Number(endSelect.value),
      name: nameInput.value.trim(),
    };

    // 基本欄位檢查
    if (!booking.date) {
      showMessage('請選擇日期。', 'error');
      return;
    }
    if (booking.end <= booking.start) {
      showMessage('結束時段必須晚於開始時段。', 'error');
      return;
    }
    if (!booking.name) {
      showMessage('請填寫預約人姓名。', 'error');
      nameInput.focus();
      return;
    }

    // 衝突檢查
    const bookings = loadBookings();
    const conflict = findConflict(bookings, booking);
    if (conflict) {
      showMessage(
        `預約失敗：${ROOMS[conflict.room]} 在 ${conflict.date} ` +
        `${formatHour(conflict.start)}–${formatHour(conflict.end)} ` +
        `已被「${conflict.name}」預約，時段重疊。`,
        'error'
      );
      return;
    }

    // 儲存並更新畫面
    bookings.push(booking);
    saveBookings(bookings);
    showMessage(
      `預約成功：${ROOMS[booking.room]} ${booking.date} ` +
      `${formatHour(booking.start)}–${formatHour(booking.end)}（${booking.name}）`,
      'ok'
    );
    nameInput.value = '';
    viewDateInput.value = booking.date;
    weekRoom = booking.room; // 週視圖也要看得到剛送出的預約
    freshId = booking.id;
    render();
    freshId = null;
  });

  // ===== 畫面繪製 =====
  function render() {
    const viewDate = currentViewDate();
    const isWeek = viewMode === 'week';

    // 控制列：依模式切換按鈕文字與選項
    modeDayBtn.setAttribute('aria-pressed', String(!isWeek));
    modeWeekBtn.setAttribute('aria-pressed', String(isWeek));
    weekRoomSelect.hidden = !isWeek;
    weekRoomSelect.value = weekRoom;
    prevBtn.textContent = isWeek ? '上一週' : '前一天';
    todayBtn.textContent = isWeek ? '本週' : '今天';
    nextBtn.textContent = isWeek ? '下一週' : '後一天';

    if (isWeek) {
      renderWeek(viewDate);
      return;
    }

    const dayBookings = loadBookings()
      .filter(b => b.date === viewDate)
      .sort((a, b) => a.start - b.start || a.room - b.room);

    const d = describeDate(viewDate);
    boardTitle.textContent = '';
    boardTitle.appendChild(document.createTextNode(d.day));
    boardTitle.appendChild(createEl('span', d.weekday, 'weekday'));

    renderGrid(dayBookings, viewDate);
    renderList(dayBookings, false);
  }

  // 現在時間線：只在查看含「今天」的畫面、且在營業時段內出現
  // column 是時間線橫跨的格線欄位（日視圖跨全部會議室，週視圖只在今天那一欄）
  function appendNowLine(column) {
    const now = new Date();
    if (now.getHours() < OPEN_HOUR || now.getHours() >= CLOSE_HOUR) return;
    const line = createEl('div', '', 'nowline');
    line.style.gridColumn = column;
    line.style.gridRow = rowOf(now.getHours());
    line.style.setProperty('--at', `${(now.getMinutes() / 60) * 100}%`);
    gridBox.appendChild(line);
  }

  // 目前的格線列號（第 1 列是標題，之後每小時一列）
  function rowOf(hour) {
    return hour - OPEN_HOUR + 2;
  }

  // 時刻表看板：每列一小時，每欄一間會議室；預約是跨列的連續色塊
  function renderGrid(dayBookings, viewDate) {
    gridBox.innerHTML = '';
    gridBox.className = 'grid'; // 從週視圖切回來時，清掉週視圖的樣式
    const now = new Date();
    const isToday = viewDate === todayString();

    // 標題列：會議室名稱與目前狀態
    gridBox.appendChild(createEl('div', '', 'head corner'));
    ROOMS.forEach((name, roomIndex) => {
      const head = createEl('div', '', `head room-${roomIndex}`);
      head.appendChild(createEl('div', name, 'name'));
      const inUse = isToday && dayBookings.find(
        b => b.room === roomIndex && b.start <= now.getHours() && now.getHours() < b.end
      );
      let stateText;
      let busy = false;
      if (inUse) {
        stateText = `使用中・${inUse.name}`;
        busy = true;
      } else if (isToday) {
        stateText = '目前空閒';
      } else {
        const count = dayBookings.filter(b => b.room === roomIndex).length;
        stateText = count ? `${count} 筆預約` : '整天空閒';
      }
      head.appendChild(createEl('div', stateText, busy ? 'state busy' : 'state'));
      gridBox.appendChild(head);
    });

    // 每個小時一列：時間標籤與空時段
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      const label = createEl('div', formatHour(h), 'time');
      label.style.gridColumn = 1;
      label.style.gridRow = rowOf(h);
      gridBox.appendChild(label);

      ROOMS.forEach((name, roomIndex) => {
        const taken = dayBookings.some(b => b.room === roomIndex && b.start <= h && h < b.end);
        if (taken) return;
        const slot = createEl('button', '+', `slot room-${roomIndex}`);
        slot.type = 'button';
        slot.style.gridColumn = roomIndex + 2;
        slot.style.gridRow = rowOf(h);
        slot.setAttribute('aria-label', `預約${name} ${formatHour(h)}`);
        slot.addEventListener('click', () => fillForm(roomIndex, viewDate, h));
        gridBox.appendChild(slot);
      });
    }

    // 預約色塊：跨越起訖的所有列
    dayBookings.forEach(b => {
      const block = createEl('div', '', `booked room-${b.room}` + (b.id === freshId ? ' fresh' : ''));
      block.style.gridColumn = b.room + 2;
      block.style.gridRow = `${rowOf(b.start)} / ${rowOf(b.end)}`;
      block.appendChild(createEl('div', b.name, 'who'));
      block.appendChild(createEl('div', `${formatHour(b.start)}–${formatHour(b.end)}`, 'span'));
      gridBox.appendChild(block);
    });

    if (isToday) appendNowLine('2 / -1');
  }

  // 週視圖：單一會議室，週一到週日各一欄；預約是跨時段的連續色塊
  function renderWeek(viewDate) {
    const monday = mondayOf(viewDate);
    const days = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
    const today = todayString();
    const weekBookings = loadBookings()
      .filter(b => b.room === weekRoom && days.includes(b.date))
      .sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start);

    const first = describeDate(days[0]);
    const last = describeDate(days[6]);
    boardTitle.textContent = '';
    boardTitle.appendChild(document.createTextNode(`${first.day} – ${last.day}`));
    boardTitle.appendChild(createEl('span', `${ROOMS[weekRoom]}・週一至週日`, 'weekday'));

    gridBox.innerHTML = '';
    gridBox.className = `grid week room-${weekRoom}`;
    gridBox.appendChild(createEl('div', '', 'head corner'));

    // 標題列：點日期可跳到該天的日視圖
    days.forEach(dateStr => {
      const d = describeDate(dateStr);
      const isToday = dateStr === today;
      const head = createEl('button', '', 'head' + (isToday ? ' is-today' : ''));
      head.type = 'button';
      head.title = `查看 ${d.day} 的日視圖`;
      head.appendChild(createEl('div', d.weekday.replace('星期', '週') + (isToday ? '・今天' : ''), 'name'));
      head.appendChild(createEl('div', d.day, 'state'));
      head.addEventListener('click', () => {
        viewDateInput.value = dateStr;
        setViewMode('day');
      });
      gridBox.appendChild(head);
    });

    // 時間標籤與空時段
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      const label = createEl('div', formatHour(h), 'time');
      label.style.gridColumn = 1;
      label.style.gridRow = rowOf(h);
      gridBox.appendChild(label);

      days.forEach((dateStr, dayIndex) => {
        const taken = weekBookings.some(b => b.date === dateStr && b.start <= h && h < b.end);
        if (taken) return;
        const slot = createEl('button', '+', 'slot');
        slot.type = 'button';
        slot.style.gridColumn = dayIndex + 2;
        slot.style.gridRow = rowOf(h);
        slot.setAttribute('aria-label', `預約${ROOMS[weekRoom]} ${dateStr} ${formatHour(h)}`);
        slot.addEventListener('click', () => fillForm(weekRoom, dateStr, h));
        gridBox.appendChild(slot);
      });
    }

    // 預約色塊
    weekBookings.forEach(b => {
      const block = createEl('div', '', 'booked' + (b.id === freshId ? ' fresh' : ''));
      block.style.gridColumn = days.indexOf(b.date) + 2;
      block.style.gridRow = `${rowOf(b.start)} / ${rowOf(b.end)}`;
      block.appendChild(createEl('div', b.name, 'who'));
      block.appendChild(createEl('div', `${formatHour(b.start)}–${formatHour(b.end)}`, 'span'));
      gridBox.appendChild(block);
    });

    const todayIndex = days.indexOf(today);
    if (todayIndex >= 0) appendNowLine(String(todayIndex + 2));

    renderList(weekBookings, true);
  }

  // 點空時段：把會議室、日期與起訖時段帶入表單
  function fillForm(roomIndex, dateStr, hour) {
    roomSelect.value = roomIndex;
    dateInput.value = dateStr;
    startSelect.value = hour;
    endSelect.value = hour + 1;
    messageBox.className = 'message';
    nameInput.focus();
  }

  // 取消預約：確認後才從 localStorage 刪除該筆，並重繪
  function cancelBooking(b) {
    const msg = `確定要取消這筆預約嗎？\n${ROOMS[b.room]}　${b.date}　${formatHour(b.start)}–${formatHour(b.end)}　${b.name}`;
    if (!confirm(msg)) return;
    saveBookings(loadBookings().filter(x => x.id !== b.id));
    render();
  }

  // 預約列表：依時間排序；週視圖多一個日期欄
  function renderList(bookings, withDate) {
    const headers = (withDate ? ['日期'] : []).concat(['時段', '會議室', '預約人', '']);
    listHead.innerHTML = '';
    const headRow = document.createElement('tr');
    headers.forEach(text => headRow.appendChild(createEl('th', text)));
    listHead.appendChild(headRow);

    listBody.innerHTML = '';
    if (bookings.length === 0) {
      const tr = document.createElement('tr');
      const emptyText = withDate
        ? '這一週這間會議室還沒有預約。點看板上的空時段，或使用右側表單新增。'
        : '這一天還沒有預約。點看板上的空時段，或使用右側表單新增。';
      const td = createEl('td', emptyText, 'empty');
      td.colSpan = headers.length;
      tr.appendChild(td);
      listBody.appendChild(tr);
      return;
    }
    bookings.forEach(b => {
      const tr = document.createElement('tr');
      if (withDate) {
        const d = describeDate(b.date);
        tr.appendChild(createEl('td', `${d.day} ${d.weekday.replace('星期', '週')}`, 'time-cell'));
      }
      tr.appendChild(createEl('td', `${formatHour(b.start)}–${formatHour(b.end)}`, 'time-cell'));
      const roomTd = createEl('td', '', `room-${b.room}`);
      roomTd.appendChild(createEl('span', '', 'dot'));
      roomTd.appendChild(document.createTextNode(ROOMS[b.room]));
      tr.appendChild(roomTd);
      tr.appendChild(createEl('td', b.name));
      const actionTd = createEl('td', '', 'action-cell');
      const cancelBtn = createEl('button', '取消', 'cancel-btn');
      cancelBtn.type = 'button';
      cancelBtn.addEventListener('click', () => cancelBooking(b));
      actionTd.appendChild(cancelBtn);
      tr.appendChild(actionTd);
      listBody.appendChild(tr);
    });
  }

  // ===== 啟動 =====
  initForm();
  render();
  // 每分鐘重繪一次，讓「現在」時間線與使用中狀態保持更新
  setInterval(render, 60000);
</script>
</body>
</html>
